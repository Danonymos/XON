# Colored block light: voxel occupancy (cleared each frame) and ping-pong flood-fill volumes.
# Sizes must match XON_VOXEL_SIZE in lib/emissive_light.glsl.
#ifdef XON_COLORED_EMISSIVE_LIGHTING
image.xonVoxelImg=xonVoxelTex red_integer r8ui unsigned_int true false 96 48 96
image.xonLightImg0=xonLightTex0 rgba rgba16f float false false 96 48 96
image.xonLightImg1=xonLightTex1 rgba rgba16f float false false 96 48 96
#endif
size.buffer.colortex5=0.5 0.5
size.buffer.colortex7=0.5 0.5
texture.noise=textures/xon-noise.png
customTexture.xonGradeLUT=textures/xon-grade.png
#ifdef XON_END_BLACK_HOLE
customTexture.xonBlackHoleLUT=textures/xon-black-hole.png
#endif
#if XON_CLOUD_STYLE == 1
clouds=off
#endif
frustum.culling=true
backFace.solid=true
backFace.cutout=true
rain.depth=false
beacon.beam.depth=false

