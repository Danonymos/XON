name: Bug report
description: Report a reproducible rendering or compatibility problem.
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and expected result
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Minecraft, Iris, Sodium, GPU/driver, OS, preset/render mode, resolution, render distance, and relevant mods/resource packs.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots and relevant log errors
      description: Remove personal information before sharing logs.
