name: Build shader pack

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package and documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Build runtime ZIP
        run: python tools/build.py
      - name: Check package, source and documentation
        run: python tools/release_checks.py
      - name: Check generated shaders are current
        run: git diff --exit-code -- shaders
      - name: Upload installable pack
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: XON-Shader-${{ github.sha }}
          path: ${{ github.workspace }}/../XON-Shader-v*.zip
          if-no-files-found: error
          retention-days: 14
